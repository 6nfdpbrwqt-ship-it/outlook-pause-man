<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OutlookPauseMan 設定</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>
<body class="pm-body">
    <header class="pm-header">
        <h1>OutlookPauseMan</h1>
        <p class="pm-sub">アウトルック ポーズマン — 誤送信防止</p>
    </header>
    <main id="app-body" class="pm-main">
        <section class="pm-section">
            <h2>基本チェック</h2>
            <label><input type="checkbox" id="chk-subject"> 件名未入力チェック</label>
            <label><input type="checkbox" id="chk-body"> 本文未入力チェック</label>
            <label><input type="checkbox" id="chk-external"> 外部ドメイン警告</label>
            <label><input type="checkbox" id="chk-recipcount"> 宛先人数警告</label>
        </section>
        <section class="pm-section">
            <h2>宛先警告の閾値</h2>
            <label>
                <input type="number" id="recip-threshold" min="1" max="200" />
                人以上で警告
            </label>
        </section>
        <section class="pm-section">
            <h2>社内ドメイン(外部判定から除外)</h2>
            <textarea id="internal-domains" rows="3" placeholder="例: company.co.jp&#10;1 行 1 ドメイン"></textarea>
        </section>
        <section class="pm-section">
            <h2>禁止ワード(含む場合は送信ブロック)</h2>
            <textarea id="forbidden-words" rows="3" placeholder="例: 極秘&#10;1 行 1 ワード"></textarea>
        </section>
        <div class="pm-actions">
            <button id="save" class="pm-btn pm-btn-primary">保存</button>
            <span id="status" class="pm-status"></span>
        </div>
        <footer class="pm-footer">
            <small>Copyright (C) TATSURO HIGUCHI</small>
        </footer>
    </main>
</body>
</html>
