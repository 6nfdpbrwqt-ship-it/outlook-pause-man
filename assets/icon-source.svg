<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#3d6ad9"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd4a6"/>
      <stop offset="1" stop-color="#f5b481"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- envelope (white) -->
  <g transform="translate(18, 60)">
    <rect width="92" height="58" rx="4" fill="#ffffff"/>
    <path d="M0 0 L46 38 L92 0" fill="none" stroke="#4f7cff" stroke-width="3"/>
    <path d="M0 58 L40 24 M92 58 L52 24" stroke="#dde5ff" stroke-width="1.5"/>
  </g>
  <!-- hand (palm-down, four fingers + thumb) -->
  <g fill="url(#skin)" stroke="#c98c5d" stroke-width="1.5" stroke-linejoin="round">
    <!-- four fingers -->
    <rect x="38" y="22" width="11" height="36" rx="5"/>
    <rect x="52" y="16" width="11" height="42" rx="5"/>
    <rect x="66" y="16" width="11" height="42" rx="5"/>
    <rect x="80" y="22" width="11" height="36" rx="5"/>
    <!-- thumb -->
    <ellipse cx="30" cy="48" rx="10" ry="6" transform="rotate(-25 30 48)"/>
    <!-- palm -->
    <ellipse cx="64" cy="58" rx="30" ry="12"/>
  </g>
  <!-- pause bars on top center -->
  <g fill="#ff4f6a">
    <rect x="58" y="64" width="4" height="14" rx="1"/>
    <rect x="66" y="64" width="4" height="14" rx="1"/>
  </g>
</svg>
