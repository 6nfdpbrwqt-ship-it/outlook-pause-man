<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>OutlookPauseMan 送信前チェック</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link href="cfc0cf67467626f740c6.css" rel="stylesheet"/><style>#check-results{margin-top:8px}.pm-checking{color:#666;font-size:13px;padding:6px 0}.pm-summary{font-weight:600;padding:8px 10px;border-radius:6px;margin-bottom:8px}.pm-result{padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:13px;border-left:4px solid #ccc;background:#fafafa}.pm-result .pm-detail{color:#444;margin-top:2px;word-break:break-all}.pm-ok{border-left-color:#2e7d32;background:#edf7ed}.pm-info{border-left-color:#5b8def;background:#eef3fe}.pm-warning{border-left-color:#ed9b00;background:#fff6e6}.pm-error{border-left-color:#d32f2f;background:#fdecea}.pm-summary.pm-warning{background:#fff6e6;color:#8a5a00}.pm-summary.pm-error{background:#fdecea;color:#b71c1c}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body class="pm-body"><header class="pm-header"><h1>OutlookPauseMan</h1><p class="pm-sub">アウトルック ポーズマン — 送信前チェック</p></header><main id="app-body" class="pm-main"><section class="pm-section"><h2>送信前チェック</h2><div id="check-results"></div><div class="pm-actions"><button id="recheck" class="pm-btn pm-btn-primary">再チェック</button></div></section><section class="pm-section"><h2>基本チェック</h2><label><input type="checkbox" id="chk-subject"> 件名未入力チェック</label> <label><input type="checkbox" id="chk-body"> 本文未入力チェック</label> <label><input type="checkbox" id="chk-external"> 外部ドメイン警告</label> <label><input type="checkbox" id="chk-recipcount"> 宛先人数警告</label></section><section class="pm-section"><h2>宛先警告の閾値</h2><label><input type="number" id="recip-threshold" min="1" max="200"/> 人以上で警告</label></section><section class="pm-section"><h2>社内ドメイン(外部判定から除外)</h2><textarea id="internal-domains" rows="3" placeholder="例: company.co.jp&#10;1 行 1 ドメイン"></textarea></section><section class="pm-section"><h2>禁止ワード(含む場合は送信ブロック)</h2><textarea id="forbidden-words" rows="3" placeholder="例: 極秘&#10;1 行 1 ワード"></textarea></section><div class="pm-actions"><button id="save" class="pm-btn pm-btn-primary">保存</button> <span id="status" class="pm-status"></span></div><footer class="pm-footer"><small>Copyright (C) TATSURO HIGUCHI</small></footer></main></body></html>
